<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaySync</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/opensheetmusicdisplay"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* zinc-950 */
            color: #f4f4f5; /* zinc-100 */
        }
        
        /* Custom scrollbars */
        .osmd-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .osmd-scroll::-webkit-scrollbar-track {
            background: #18181b; 
        }
        .osmd-scroll::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 4px;
        }
        .osmd-scroll::-webkit-scrollbar-thumb:hover {
            background: #dc2626; 
        }
        .hidden-view {
            display: none !important;
        }

        /* Semi-Transparent Single-Bar Highlight Overlay */
        .measure-highlight-box {
            position: absolute;
            background-color: rgba(239, 68, 68, 0.28) !important; /* Semi-transparent Red */
            border: 2px solid #ef4444 !important;
            border-radius: 4px;
            pointer-events: none; /* Mouse clicks pass through directly to score */
            transition: all 0.12s ease-out;
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.45);
            z-index: 30;
            mix-blend-mode: screen; /* Keeps white sheet music notes completely visible */
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-zinc-950 text-zinc-100 pb-6">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 transition-all duration-300 pointer-events-none"></div>

    <!-- HOME VIEW -->
    <div id="view-home" class="flex-1 flex flex-col items-center justify-center p-6 transition-opacity duration-300 relative">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-900/20 via-zinc-950 to-zinc-950 pointer-events-none"></div>
        
        <div class="text-center mb-16 relative z-10">
            <h1 class="text-6xl font-bold text-red-600 mb-4 tracking-tight drop-shadow-lg">
                <i class="fa-solid fa-music mr-3"></i>HaySync
            </h1>
            <p class="text-lg text-zinc-400 max-w-md mx-auto">Real-time sheet music synchronization.</p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-6 w-full max-w-2xl relative z-10">
            <!-- Host Button -->
            <button onclick="switchView('host')" class="flex-1 bg-zinc-900 hover:bg-zinc-800 border-2 border-red-900 hover:border-red-600 text-zinc-100 rounded-xl p-8 shadow-2xl transition-all flex flex-col items-center gap-4 group">
                <div class="bg-red-600/10 p-4 rounded-full group-hover:bg-red-600/20 transition-colors">
                    <i class="fa-solid fa-chalkboard-user text-4xl text-red-500"></i>
                </div>
                <span class="text-2xl font-bold">Host Rehearsal</span>
                <span class="text-sm text-zinc-500">Load music, control the session</span>
            </button>
            
            <!-- Student Button -->
            <button onclick="switchView('student')" class="flex-1 bg-zinc-900 hover:bg-zinc-800 border-2 border-zinc-800 hover:border-red-600 text-zinc-100 rounded-xl p-8 shadow-2xl transition-all flex flex-col items-center gap-4 group">
                <div class="bg-zinc-800 p-4 rounded-full group-hover:bg-red-600/20 transition-colors">
                    <i class="fa-solid fa-users text-4xl text-zinc-400 group-hover:text-red-500 transition-colors"></i>
                </div>
                <span class="text-2xl font-bold">Join Session</span>
                <span class="text-sm text-zinc-500">Enter code, follow along</span>
            </button>
        </div>
    </div>

    <!-- HOST VIEW -->
    <div id="view-host" class="hidden-view flex-1 flex flex-col h-full bg-zinc-950 relative">
        <header class="bg-zinc-900 border-b border-red-900 p-4 flex flex-wrap items-center justify-between shadow-md z-10">
            <div class="flex items-center gap-4">
                <button onclick="switchView('home')" class="p-2 hover:bg-red-600/20 text-zinc-400 hover:text-red-500 rounded-lg transition" title="Leave">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
                </button>
                <h2 class="text-xl font-bold text-zinc-100">Conductor</h2>
                <span class="text-xs text-zinc-500 hidden sm:inline ml-4 border border-zinc-700 rounded px-2 py-1">Use Left/Right Arrows or Spacebar to change bar</span>
            </div>
            
            <div class="flex items-center gap-4 mt-2 sm:mt-0">
                <div class="bg-black px-4 py-2 rounded-lg border border-red-900/50 shadow-inner">
                    <span class="text-zinc-500 text-sm uppercase tracking-wider mr-2">Room Code:</span>
                    <span id="host-room-code" class="text-2xl font-bold text-red-500 tracking-widest font-mono">----</span>
                </div>
            </div>
        </header>

        <div id="drop-zone" class="flex-1 flex flex-col items-center justify-center p-8 bg-zinc-900/50 border-4 border-dashed border-zinc-700 m-8 rounded-2xl transition-colors hover:border-red-600 hover:bg-red-950/20">
            <i class="fa-solid fa-file-audio text-6xl text-red-600 mb-6 drop-shadow-md"></i>
            <h3 class="text-3xl font-bold text-zinc-100 mb-2">Load MusicXML</h3>
            <p class="text-zinc-400 mb-8 text-lg">Drag & drop file here, or click below</p>
            <input type="file" id="file-input" accept=".musicxml,.xml" class="hidden">
            <button onclick="document.getElementById('file-input').click()" class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-lg shadow-lg shadow-red-900/50 transition font-bold text-lg">
                Browse Files
            </button>
        </div>

        <div id="osmd-host-wrapper" class="hidden-view flex-1 overflow-auto osmd-scroll relative p-4 bg-zinc-950">
            <div id="host-highlight-box" class="measure-highlight-box hidden-view"></div>
            <div id="osmd-host-container" class="w-full min-h-full cursor-pointer relative"></div>
        </div>
    </div>

    <!-- STUDENT VIEW -->
    <div id="view-student" class="hidden-view flex-1 flex flex-col h-full bg-zinc-950">
        <header class="bg-zinc-900 border-b border-zinc-800 p-3 sm:p-4 flex flex-col lg:flex-row items-center justify-between shadow-md z-10 gap-4">
            <div class="flex items-center gap-3 w-full lg:w-auto">
                <button onclick="switchView('home')" class="p-2 hover:bg-zinc-800 text-zinc-400 hover:text-white rounded-lg transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                
                <div class="flex bg-black border border-zinc-700 rounded-lg overflow-hidden flex-1 sm:flex-none">
                    <input type="text" id="join-code-input" placeholder="CODE" class="bg-transparent text-white placeholder-zinc-600 px-4 py-2 outline-none w-28 font-mono font-bold tracking-widest uppercase text-center" maxlength="4">
                    <button onclick="joinRehearsal()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 font-bold transition">Join</button>
                </div>
            </div>

            <div id="student-controls" class="flex flex-wrap items-center justify-center lg:justify-end gap-3 w-full lg:w-auto opacity-50 pointer-events-none transition-opacity">
                <div class="relative flex-1 sm:flex-none">
                    <select id="part-selector" onchange="selectPart(this.value)" class="appearance-none w-full bg-zinc-800 border-2 border-red-500 text-white px-4 py-2 pr-10 rounded-lg outline-none font-medium shadow-sm transition cursor-pointer animate-pulse">
                        <option value="" disabled selected>Select Your Part...</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-zinc-400 pointer-events-none"></i>
                </div>
                
                <div class="flex bg-zinc-800 border border-zinc-700 rounded-lg overflow-hidden">
                    <button onclick="transposeStudent(-12)" class="px-3 py-2 hover:bg-zinc-700 transition text-sm font-medium border-r border-zinc-700 text-zinc-300 hover:text-white" title="Down 1 Octave">
                        <i class="fa-solid fa-minus text-red-500 mr-1"></i> 8vb
                    </button>
                    <button onclick="transposeStudent(12)" class="px-3 py-2 hover:bg-zinc-700 transition text-sm font-medium text-zinc-300 hover:text-white" title="Up 1 Octave">
                        <i class="fa-solid fa-plus text-red-500 mr-1"></i> 8va
                    </button>
                </div>

                <div class="flex gap-2">
                    <button id="btn-autoscroll" onclick="toggleAutoScroll()" class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 transition shadow-lg text-sm font-medium">
                        <i class="fa-solid fa-angles-down mr-1"></i> Auto-Scroll
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-4 bg-zinc-950 flex items-center justify-center relative z-0" id="student-placeholder">
            <div class="text-center text-zinc-600">
                <i class="fa-solid fa-music text-8xl mb-6 opacity-20"></i>
                <p class="text-xl font-medium">Enter a room code to sync with the conductor.</p>
            </div>
        </div>
        
        <div id="osmd-student-wrapper" class="hidden-view flex-1 overflow-auto osmd-scroll relative p-6 bg-zinc-950">
            <div id="student-highlight-box" class="measure-highlight-box hidden-view"></div>
            <div id="osmd-student-container" class="w-full min-h-full relative"></div>
        </div>
    </div>

    <!-- VERSION FOOTER BAR -->
    <footer class="fixed bottom-0 left-0 right-0 h-6 bg-zinc-900 border-t border-zinc-800 px-4 flex items-center justify-between text-[11px] text-zinc-500 font-mono z-50 pointer-events-none">
        <div>HaySync App</div>
        <div>v1.4.0 • Updated: 21 Sep 2026, 09:05 AEST (Sydney)</div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAJSw8QFuzMoCXqZY2wmO3Nmy2Fdy6Q4U",
            authDomain: "haysync-9b816.firebaseapp.com",
            databaseURL: "https://haysync-9b816-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "haysync-9b816",
            storageBucket: "haysync-9b816.firebasestorage.app",
            messagingSenderId: "717730658604",
            appId: "1:717730658604:web:e09a312b2ac7c8426e9489",
            measurementId: "G-B9M5VTMB4B"
        };
            
        let app, db;
        let isFirebaseActive = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            isFirebaseActive = true;
            console.log("Firebase initialized");
        } catch(e) {
            console.log("Firebase config error.");
        }

        // Global State
        let currentView = 'home';
        let osmdHost = null;
        let osmdStudent = null;
        let roomCode = "";
        let currentXmlData = null; 
        
        // Measure Tracking
        let currentMeasureNumber = 1;
        let autoScrollEnabled = true;

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let styleClasses = 'bg-zinc-800 border border-zinc-700 text-zinc-100';
            let icon = 'fa-info-circle text-zinc-400';
            
            if(type === 'error') {
                styleClasses = 'bg-red-950 border border-red-800 text-red-100';
                icon = 'fa-circle-exclamation text-red-500';
            }
            if(type === 'success') {
                styleClasses = 'bg-zinc-900 border border-red-600 text-zinc-100 shadow-[0_0_15px_rgba(220,38,38,0.3)]';
                icon = 'fa-check-circle text-red-500';
            }
            
            toast.className = `${styleClasses} px-6 py-3 rounded-xl shadow-2xl font-medium text-sm flex items-center gap-3 transform -translate-y-10 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> ${message}`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('-translate-y-10', 'opacity-0');
            });
            
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.switchView = function(viewName) {
            document.getElementById('view-home').classList.add('hidden-view');
            document.getElementById('view-host').classList.add('hidden-view');
            document.getElementById('view-student').classList.add('hidden-view');
            
            document.getElementById(`view-${viewName}`).classList.remove('hidden-view');
            currentView = viewName;
            
            if (viewName === 'host' && !roomCode) {
                generateRoomCode();
                initHostOSMD();
            }
            if (viewName === 'student') {
                initStudentOSMD();
            }
        };

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            roomCode = '';
            for (let i = 0; i < 4; i++) {
                roomCode += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('host-room-code').innerText = roomCode;
            
            if (isFirebaseActive) {
                const roomRef = ref(db, `rooms/${roomCode}`);
                set(roomRef, { measure: 1, active: true, timestamp: Date.now() })
                .catch(err => console.error("Database connection error:", err));
            }
        }

        window.joinRehearsal = function() {
            const input = document.getElementById('join-code-input').value.toUpperCase();
            if (input.length !== 4) {
                showToast('Please enter a valid 4-character code.', 'error');
                return;
            }
            
            showToast(`Connecting to ${input}...`, 'info');
            
            if (isFirebaseActive) {
                const roomRef = ref(db, `rooms/${input}`);
                get(roomRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        const roomData = snapshot.val();
                        if (roomData.xmlData) {
                            currentXmlData = roomData.xmlData;
                            document.getElementById('student-controls').classList.remove('opacity-50', 'pointer-events-none');
                            showToast(`Score downloaded! Please select your part.`, 'success');
                            
                            populateStudentParts(currentXmlData);
                            
                            // Listen for conductor measure updates
                            const measureRef = ref(db, `rooms/${input}/measure`);
                            onValue(measureRef, (snap) => {
                                const measure = snap.val();
                                if(measure) syncToMeasure(measure);
                            });
                        } else {
                            showToast('Room exists, but host has not loaded music yet.', 'error');
                        }
                    } else {
                        showToast('Room not found. Check code.', 'error');
                    }
                }).catch(err => {
                    showToast('Database error.', 'error');
                    console.error(err);
                });
            }
        };

        function initHostOSMD() {
            if (!osmdHost && window.opensheetmusicdisplay) {
                const container = document.getElementById('osmd-host-container');
                osmdHost = new window.opensheetmusicdisplay.OpenSheetMusicDisplay(container, {
                    autoResize: true,
                    backend: "svg",
                    drawTitle: true,
                    drawPartNames: true,
                    darkMode: true, 
                    defaultColorMusic: "#e4e4e7"
                });
                setupHostClickInteractions();
            }
        }

        function initStudentOSMD() {
            if (!osmdStudent && window.opensheetmusicdisplay) {
                const container = document.getElementById('osmd-student-container');
                osmdStudent = new window.opensheetmusicdisplay.OpenSheetMusicDisplay(container, {
                    autoResize: true,
                    backend: "svg",
                    drawTitle: false,
                    drawPartNames: false,
                    darkMode: true,
                    defaultColorMusic: "#e4e4e7"
                });
            }
        }

        // --- HOST FILE LOADING & UPLOAD ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, e => e.preventDefault(), false));
        ['dragenter', 'dragover'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.add('border-red-600', 'bg-red-900/20'), false));
        ['dragleave', 'drop'].forEach(eventName => dropZone.addEventListener(eventName, () => dropZone.classList.remove('border-red-600', 'bg-red-900/20'), false));
        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files), false);
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files), false);

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            showToast('Processing score...', 'info');
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                currentXmlData = e.target.result;
                
                try {
                    document.getElementById('drop-zone').classList.add('hidden-view');
                    document.getElementById('osmd-host-wrapper').classList.remove('hidden-view');
                    
                    await osmdHost.load(currentXmlData);
                    osmdHost.render();
                    
                    setTimeout(() => {
                        highlightMeasure(osmdHost, 'host-highlight-box', 1, 'osmd-host-wrapper');
                    }, 200);
                    showToast('Score rendered. Red bar active!', 'success');
                } catch (err) {
                    console.error("OSMD Render Error:", err);
                    showToast('Failed to draw sheet music.', 'error');
                    return; 
                }
                
                if (isFirebaseActive && roomCode) {
                    setTimeout(() => {
                        showToast('Uploading score to sync engine...', 'info');
                        set(ref(db, `rooms/${roomCode}/xmlData`), currentXmlData)
                            .then(() => showToast('Score ready for students!', 'success'))
                            .catch((err) => showToast('Cloud upload failed.', 'error'));
                    }, 500); 
                }
            };
            reader.readAsText(file);
        }

        // --- ACCURATE SINGLE MEASURE HIGHLIGHT ENGINE ---
        function highlightMeasure(osmdInstance, highlightBoxId, measureNumber, wrapperId) {
            const highlightBox = document.getElementById(highlightBoxId);
            if (!osmdInstance || !osmdInstance.graphic) return;

            const measureIndex = measureNumber - 1; 
            const graphicSheet = osmdInstance.graphic;
            
            if (!graphicSheet.measureList || !graphicSheet.measureList[measureIndex]) {
                highlightBox.classList.add('hidden-view');
                return;
            }

            try {
                // Get all visible staff measures for the specific target measure index
                const measureStaves = graphicSheet.measureList[measureIndex];
                
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                let validCount = 0;

                measureStaves.forEach(stave => {
                    // Check if stave measure is valid and visible in current rendering
                    if (stave && stave.stave && stave.stave.rendered !== false && stave.PositionAndShape) {
                        const pos = stave.PositionAndShape;
                        const absPos = pos.AbsolutePosition;
                        const size = pos.Size;

                        if (absPos && size) {
                            validCount++;
                            const x = absPos.x * 10;
                            const y = absPos.y * 10;
                            const w = size.width * 10;
                            const h = size.height * 10;

                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if ((x + w) > maxX) maxX = x + w;
                            if ((y + h) > maxY) maxY = y + h;
                        }
                    }
                });

                if (validCount === 0) {
                    highlightBox.classList.add('hidden-view');
                    return;
                }

                const top = Math.max(0, minY - 10);
                const left = Math.max(0, minX - 2);
                const width = Math.max(maxX - minX + 4, 30);
                const height = Math.max(maxY - minY + 20, 60);

                highlightBox.style.top = `${top}px`;
                highlightBox.style.left = `${left}px`;
                highlightBox.style.width = `${width}px`;
                highlightBox.style.height = `${height}px`;
                highlightBox.classList.remove('hidden-view');

                // Smooth Auto-Scroll to keep active bar visible
                if (autoScrollEnabled && wrapperId) {
                    const wrapper = document.getElementById(wrapperId);
                    wrapper.scrollTo({
                        top: Math.max(0, top - 100),
                        behavior: 'smooth'
                    });
                }
            } catch (err) {
                console.warn("Exact measure calculation fallback:", err);
            }
        }

        // --- CONDUCTOR CONTROLS (Click, Space, Left/Right Arrows) ---
        function setupHostClickInteractions() {
            const container = document.getElementById('osmd-host-container');
            
            // Click to move to next bar
            container.addEventListener('click', (e) => {
                advanceHostMeasure(currentMeasureNumber + 1);
            });
        }

        // Keyboard Shortcuts (Space, Right Arrow, Left Arrow)
        document.addEventListener('keydown', (e) => {
            if (currentView === 'host') {
                if (e.code === 'Space' || e.code === 'ArrowRight') {
                    e.preventDefault();
                    advanceHostMeasure(currentMeasureNumber + 1);
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    advanceHostMeasure(currentMeasureNumber - 1);
                }
            }
        });

        function advanceHostMeasure(targetMeasure) {
            if (!osmdHost || !osmdHost.graphic) return;
            
            const totalMeasures = osmdHost.graphic.measureList.length;
            
            // Loop back or clamp boundaries
            if (targetMeasure > totalMeasures) targetMeasure = 1;
            if (targetMeasure < 1) targetMeasure = totalMeasures;
            
            currentMeasureNumber = targetMeasure;
            
            // Draw highlight rectangle on conductor measure
            highlightMeasure(osmdHost, 'host-highlight-box', currentMeasureNumber, 'osmd-host-wrapper');
            
            // Broadcast new measure number to Firebase
            if (isFirebaseActive && roomCode) {
                set(ref(db, `rooms/${roomCode}/measure`), currentMeasureNumber);
            }
        }

        // --- STUDENT PARSING & SYNC ---
        window.populateStudentParts = function(xmlString) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");
            const partList = xmlDoc.getElementsByTagName("score-part");
            
            const selector = document.getElementById('part-selector');
            selector.innerHTML = '<option value="" disabled selected>Select Your Part...</option>';
            
            for(let i=0; i < partList.length; i++) {
                let name = `Part ${i+1}`;
                const nameNode = partList[i].getElementsByTagName("part-name")[0];
                if(nameNode) name = nameNode.textContent;
                
                const opt = document.createElement('option');
                opt.value = i; 
                opt.text = name;
                selector.appendChild(opt);
            }
        };

        window.selectPart = async function(partIndexStr) {
            if(!currentXmlData) return;
            const index = parseInt(partIndexStr);
            
            document.getElementById('part-selector').classList.remove('animate-pulse', 'border-red-500');
            document.getElementById('part-selector').classList.add('border-zinc-700');
            
            showToast('Loading your part...', 'info');
            document.getElementById('student-placeholder').classList.add('hidden-view');
            const wrapper = document.getElementById('osmd-student-wrapper');
            wrapper.classList.remove('hidden-view');
            
            await osmdStudent.load(currentXmlData);
            
            // Isolate selected part by setting visibility flags
            for(let i=0; i < osmdStudent.sheet.Instruments.length; i++) {
                osmdStudent.sheet.Instruments[i].Visible = (i === index);
            }
            
            osmdStudent.render();
            setTimeout(() => {
                syncToMeasure(currentMeasureNumber);
            }, 200);
            showToast('Ready to play.', 'success');
        };

        function syncToMeasure(measureNumber) {
            currentMeasureNumber = measureNumber;
            if (!osmdStudent || !osmdStudent.graphic) return;
            
            // Draw highlight rectangle on single student measure
            highlightMeasure(osmdStudent, 'student-highlight-box', measureNumber, 'osmd-student-wrapper');
        }

        // --- STUDENT HELPER ACTIONS ---
        window.transposeStudent = function(semitones) {
            showToast(`Transposing octave...`, 'info');
        };

        window.toggleAutoScroll = function() {
            autoScrollEnabled = !autoScrollEnabled;
            const btn = document.getElementById('btn-autoscroll');
            if(autoScrollEnabled) {
                btn.classList.add('bg-red-600', 'text-white');
                btn.classList.remove('bg-zinc-800', 'text-zinc-400');
                showToast('Auto-scroll enabled');
            } else {
                btn.classList.remove('bg-red-600', 'text-white');
                btn.classList.add('bg-zinc-800', 'text-zinc-400');
                showToast('Auto-scroll disabled');
            }
        };
    </script>
</body>
</html>
